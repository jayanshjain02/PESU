name: Deploy Semester 5 study site

on:
  push:
    branches: [main]
    paths:
      - 'SEM 5/**'
      - '.github/workflows/semester5-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'SEM 5'
      - id: deployment
        uses: actions/deploy-pages@v4
