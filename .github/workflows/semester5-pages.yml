name: Deploy Semester 5 study site

on:
  push:
    branches: [main]
    paths:
      - 'SEM 5/**'
      - '.github/workflows/semester5-pages.yml'
      - '.github/scripts/deploy-pages.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'SEM 5'
      - id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            await require('./.github/scripts/deploy-pages.cjs')({ github, context, core });
