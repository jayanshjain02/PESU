<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Semester 5 study material reader.">
    <title>Study Reader | Semester 5</title>
    <link rel="stylesheet" href="styles.css">
    <script src="study.js" defer></script>
  </head>
  <body class="reader-page">
    <a class="skip-link" href="#reader-content">Skip to content</a>
    <header class="site-header"><nav class="nav container" aria-label="Study reader navigation"><a class="brand" href="index.html" aria-label="Return to Semester 5 home">Semester <span>5</span></a><a class="reader-home" href="index.html">← All courses</a></nav></header>
    <main id="reader-content" class="reader container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Semester 5</a><span aria-hidden="true">/</span><span id="reader-crumb">Study reader</span></nav>
      <div class="reader-heading"><div><p class="eyebrow" id="reader-kicker">Study material</p><h1 id="reader-title">Loading…</h1></div><span class="status-pill" id="reader-status">Loading</span></div>
      <nav class="reader-pagination" id="reader-pagination" aria-label="Study-section pagination"></nav>
      <nav class="reader-topic-pagination" id="reader-topic-pagination" aria-label="Module pagination" hidden></nav>
      <article class="note-card reader-card" id="reader-card" aria-live="polite" aria-busy="true"><p class="note-label">Loading</p><h4>Opening study material…</h4></article>
      <nav class="reader-navigation" id="reader-navigation" aria-label="Study-section navigation"></nav>
    </main>
  </body>
</html>
